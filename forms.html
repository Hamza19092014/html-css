<html>
    <head>
        <title>Forms</title>
    </head>
    <body>
        <h3>Prva forma</h3>

        <form>
            <label for="name">Ime</label>:</label> <br>
            <input type="text" id="name">

            <br>

            <label for="age">Godine:</label>:</label> <br>
            <input type="number" id="age"> 

            <br><br>

            <button>Posalji</button>

        </form>

        <hr>

        <h3>Forma za registraciju</h3>
        
        <form>
            <label for="username">Korisničko ime:</label> <br>
            <input type="text" id="username" required>

            <br><br>

            <label for="email">Email:</label> <br>
            <input type="email" id="email" required>

            <br><br>

            <label for="password">Lozinka:</label> <br>
            <input type="password" id="password" required>

            <h4>Odaberi spol</h4>

            <input type="radio" id="Musko" name="spol"
            <label for="musko">Muško</label> 

            <input type="radio" id="Zensko"> name="spol"
            <label for="zensko">Žensko</label> 
 
 
            <h4>Odaberi jezike koje poznajes:</h4>

            <input type="checkbox" id="html" name="jezik">
            <label for="html">HTML</label>

            <br>

            <input type="checkbox" id="css" name="jezik">
            <label for="css">Css</label>

            <br>

            <input type="checkbox" id="javascript" name="jezik">
            <label for="javascript">JavaScript</label>

            <br>


            <h4>Odaberi grad:</h4>

            <select id="grad" name="grad">
                <option>Odaberi grad</option>
                <option>Sarajevo</option>
                <option>Zenica</option>
                <option>Tuzla</option>
                <option>Bihać</option>
            </select>

            <br>
            <br>

            <label for="poruka">Poruka:</label> <br>
            <textarea id="poruka" name="poruka" rows="20" cols="30"></textarea>
 
 
            <br><br>
            <button>Posalji</button>
        
        </form>
    
    </body>
</html>
